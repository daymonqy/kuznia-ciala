<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuźnia Ciała - Biblioteka</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 90px;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: #feca57;
      margin: 12px 0 20px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 4px;
    }
    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #888;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs button.on {
      background: rgba(254, 202, 87, 0.2);
      color: #feca57;
    }
    .panel { display: none; }
    .panel.show { display: block; }

    .btn-create {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px dashed rgba(254, 202, 87, 0.5);
      border-radius: 12px;
      background: rgba(254, 202, 87, 0.08);
      color: #feca57;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-create:hover {
      background: rgba(254, 202, 87, 0.15);
    }

    .form-card {
      display: none;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .form-card.show { display: block; }
    .form-card h3 {
      font-size: 1rem;
      margin-bottom: 14px;
      color: #feca57;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: #feca57; }
    textarea { min-height: 80px; resize: vertical; }
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-save {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #feca57, #ff9f43);
      color: #0f0f0f;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: transparent;
      color: #aaa;
      font-weight: 600;
      cursor: pointer;
    }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
    }
    .card-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
      color: #fff;
    }
    .card-meta {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #bbb;
      line-height: 1.4;
    }
    .card-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .card-actions button {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #888;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .card-actions button.del {
      color: #e17055;
      border-color: rgba(225, 112, 85, 0.4);
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 32px 16px;
      font-size: 0.9rem;
    }
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.ok { background: #00b894; color: #fff; }
    .toast.err { background: #e17055; color: #fff; }
    .toast.info { background: #0984e3; color: #fff; }

    .status {
      position: fixed; top: 12px; right: 12px;
      background: rgba(15,15,15,0.9);
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.75rem; color: #888;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status.on { color: #48dbfb; border-color: rgba(72,219,251,0.3); }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: rgba(15,15,15,0.95);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 1000;
    }
    .nav a {
      display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: #888; font-size: 0.7rem; width: 20%;
    }
    .nav a i { font-size: 1.4rem; margin-bottom: 4px; }
    .nav a.active { color: #48dbfb; }
  </style>
</head>
<body>
  <div class="status" id="status"><i class="fas fa-user"></i> Gość</div>
  <div class="toast" id="toast"></div>

  <div class="wrap">
    <h1>Biblioteka</h1>

    <div class="tabs">
      <button type="button" id="tabProgram" class="on" onclick="showProgram()">Program</button>
      <button type="button" id="tabCwiczenia" onclick="showCwiczenia()">Ćwiczenia</button>
    </div>

    <!-- PANEL PROGRAM -->
    <div class="panel show" id="panelProgram">
      <button type="button" class="btn-create" onclick="openProgramForm()">
        <i class="fas fa-plus"></i> Utwórz program
      </button>

      <div class="form-card" id="formProgram">
        <h3>Nowy program</h3>
        <label for="progName">Nazwa programu</label>
        <input type="text" id="progName" placeholder="Np. Siła 4 tygodnie">

        <label for="progDesc">Opis</label>
        <textarea id="progDesc" placeholder="Cel, długość, uwagi..."></textarea>

        <label for="progWeeks">Liczba tygodni</label>
        <input type="number" id="progWeeks" min="1" max="52" value="4" placeholder="4">

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeProgramForm()">Anuluj</button>
          <button type="button" class="btn-save" onclick="saveProgram()">Zapisz</button>
        </div>
      </div>

      <div class="list" id="listProgram"></div>
    </div>

    <!-- PANEL ĆWICZENIA -->
    <div class="panel" id="panelCwiczenia">
      <button type="button" class="btn-create" onclick="openExerciseForm()">
        <i class="fas fa-plus"></i> Utwórz ćwiczenie
      </button>

      <div class="form-card" id="formExercise">
        <h3>Nowe ćwiczenie</h3>
        <label for="exName">Nazwa ćwiczenia</label>
        <input type="text" id="exName" placeholder="Np. Przysiady">

        <label for="exMuscle">Partia mięśniowa</label>
        <select id="exMuscle">
          <option value="Nogi">Nogi</option>
          <option value="Klatka">Klatka</option>
          <option value="Plecy">Plecy</option>
          <option value="Barki">Barki</option>
          <option value="Biceps">Biceps</option>
          <option value="Triceps">Triceps</option>
          <option value="Brzuch">Brzuch</option>
          <option value="Całe ciało">Całe ciało</option>
        </select>

        <label for="exDesc">Opis / wskazówki</label>
        <textarea id="exDesc" placeholder="Jak wykonać, tempo, uwagi..."></textarea>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeExerciseForm()">Anuluj</button>
          <button type="button" class="btn-save" onclick="saveExercise()">Zapisz</button>
        </div>
      </div>

      <div class="list" id="listExercise"></div>
    </div>
  </div>

  <nav class="nav">
    <a href="index.html"><i class="fas fa-home"></i><span>Główna</span></a>
    <a href="eksploruj.html"><i class="fas fa-search"></i><span>Eksploruj</span></a>
    <a href="trening.html"><i class="fas fa-dumbbell"></i><span>Trening</span></a>
    <a href="biblioteka.html" class="active"><i class="fas fa-book"></i><span>Biblioteka</span></a>
    <a href="ty.html"><i class="fas fa-user"></i><span>Ty</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    var auth = null, db = null, currentUser = null;
    var programs = [];
    var exercises = [];

    try {
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.error(e);
    }

    function toast(text, type) {
      var el = document.getElementById('toast');
      el.textContent = text;
      el.className = 'toast ' + (type || 'info') + ' show';
      setTimeout(function() { el.classList.remove('show'); }, 3000);
    }

    function showProgram() {
      document.getElementById('panelProgram').classList.add('show');
      document.getElementById('panelCwiczenia').classList.remove('show');
      document.getElementById('tabProgram').classList.add('on');
      document.getElementById('tabCwiczenia').classList.remove('on');
    }

    function showCwiczenia() {
      document.getElementById('panelCwiczenia').classList.add('show');
      document.getElementById('panelProgram').classList.remove('show');
      document.getElementById('tabCwiczenia').classList.add('on');
      document.getElementById('tabProgram').classList.remove('on');
    }

    function openProgramForm() {
      document.getElementById('formProgram').classList.add('show');
      document.getElementById('progName').focus();
    }
    function closeProgramForm() {
      document.getElementById('formProgram').classList.remove('show');
      document.getElementById('progName').value = '';
      document.getElementById('progDesc').value = '';
      document.getElementById('progWeeks').value = '4';
    }

    function openExerciseForm() {
      document.getElementById('formExercise').classList.add('show');
      document.getElementById('exName').focus();
    }
    function closeExerciseForm() {
      document.getElementById('formExercise').classList.remove('show');
      document.getElementById('exName').value = '';
      document.getElementById('exDesc').value = '';
      document.getElementById('exMuscle').value = 'Nogi';
    }

    // ---- Zapis lokalny (działa zawsze) + Firebase gdy zalogowany ----
    function storageKey(kind) {
      var uid = currentUser ? currentUser.uid : 'guest';
      return 'kuznia_' + kind + '_' + uid;
    }

    function loadLocal() {
      try {
        programs = JSON.parse(localStorage.getItem(storageKey('programs')) || '[]');
        exercises = JSON.parse(localStorage.getItem(storageKey('exercises')) || '[]');
      } catch (e) {
        programs = [];
        exercises = [];
      }
      renderPrograms();
      renderExercises();
    }

    function saveLocal() {
      localStorage.setItem(storageKey('programs'), JSON.stringify(programs));
      localStorage.setItem(storageKey('exercises'), JSON.stringify(exercises));
    }

    async function syncToCloud() {
      if (!currentUser || !db) return;
      try {
        await db.collection('users').doc(currentUser.uid).set({
          programs: programs,
          exercises: exercises,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error('Cloud sync:', e);
      }
    }

    async function loadFromCloud() {
      if (!currentUser || !db) return;
      try {
        var doc = await db.collection('users').doc(currentUser.uid).get();
        if (doc.exists) {
          var data = doc.data();
          if (data.programs) programs = data.programs;
          if (data.exercises) exercises = data.exercises;
          saveLocal();
          renderPrograms();
          renderExercises();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function saveProgram() {
      var name = document.getElementById('progName').value.trim();
      var desc = document.getElementById('progDesc').value.trim();
      var weeks = parseInt(document.getElementById('progWeeks').value, 10) || 1;

      if (!name) {
        toast('Podaj nazwę programu', 'err');
        return;
      }

      var item = {
        id: Date.now().toString(),
        name: name,
        description: desc,
        weeks: weeks,
        createdAt: new Date().toISOString()
      };

      programs.unshift(item);
      saveLocal();
      syncToCloud();
      renderPrograms();
      closeProgramForm();
      toast('Program zapisany!', 'ok');
    }

    function saveExercise() {
      var name = document.getElementById('exName').value.trim();
      var muscle = document.getElementById('exMuscle').value;
      var desc = document.getElementById('exDesc').value.trim();

      if (!name) {
        toast('Podaj nazwę ćwiczenia', 'err');
        return;
      }

      var item = {
        id: Date.now().toString(),
        name: name,
        muscle: muscle,
        description: desc,
        createdAt: new Date().toISOString()
      };

      exercises.unshift(item);
      saveLocal();
      syncToCloud();
      renderExercises();
      closeExerciseForm();
      toast('Ćwiczenie zapisane!', 'ok');
    }

    function deleteProgram(id) {
      if (!confirm('Usunąć ten program?')) return;
      programs = programs.filter(function(p) { return p.id !== id; });
      saveLocal();
      syncToCloud();
      renderPrograms();
      toast('Program usunięty', 'info');
    }

    function deleteExercise(id) {
      if (!confirm('Usunąć to ćwiczenie?')) return;
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveLocal();
      syncToCloud();
      renderExercises();
      toast('Ćwiczenie usunięte', 'info');
    }

    function renderPrograms() {
      var el = document.getElementById('listProgram');
      if (!programs.length) {
        el.innerHTML = '<div class="empty">Brak programów.<br>Kliknij „Utwórz program”, aby dodać pierwszy.</div>';
        return;
      }
      el.innerHTML = programs.map(function(p) {
        return '<div class="card">' +
          '<div class="card-title">' + escapeHtml(p.name) + '</div>' +
          '<div class="card-meta">' + p.weeks + ' tyg. · ' + formatDate(p.createdAt) + '</div>' +
          (p.description ? '<div class="card-desc">' + escapeHtml(p.description) + '</div>' : '') +
          '<div class="card-actions">' +
            '<button type="button" class="del" onclick="deleteProgram(\'' + p.id + '\')"><i class="fas fa-trash"></i> Usuń</button>' +
          '</div></div>';
      }).join('');
    }

    function renderExercises() {
      var el = document.getElementById('listExercise');
      if (!exercises.length) {
        el.innerHTML = '<div class="empty">Brak ćwiczeń.<br>Kliknij „Utwórz ćwiczenie”, aby dodać pierwsze.</div>';
        return;
      }
      el.innerHTML = exercises.map(function(e) {
        return '<div class="card">' +
          '<div class="card-title">' + escapeHtml(e.name) + '</div>' +
          '<div class="card-meta">' + escapeHtml(e.muscle) + ' · ' + formatDate(e.createdAt) + '</div>' +
          (e.description ? '<div class="card-desc">' + escapeHtml(e.description) + '</div>' : '') +
          '<div class="card-actions">' +
            '<button type="button" class="del" onclick="deleteExercise(\'' + e.id + '\')"><i class="fas fa-trash"></i> Usuń</button>' +
          '</div></div>';
      }).join('');
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '';
      try {
        var d = new Date(iso);
        return d.toLocaleDateString('pl-PL');
      } catch (e) { return ''; }
    }

    // Auth status
    if (auth) {
      auth.onAuthStateChanged(function(user) {
        currentUser = user;
        var status = document.getElementById('status');
        if (user) {
          status.innerHTML = '<i class="fas fa-user-check"></i> ' + (user.displayName || user.email);
          status.classList.add('on');
          loadFromCloud().then(function() {
            if (!programs.length && !exercises.length) loadLocal();
          });
        } else {
          status.innerHTML = '<i class="fas fa-user"></i> Gość';
          status.classList.remove('on');
          loadLocal();
        }
      });
    } else {
      loadLocal();
    }
  </script>
</body>
</html>
