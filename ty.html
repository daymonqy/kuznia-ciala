<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuźnia Ciała - Ty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px;
        }
        .content {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center;
        }
        .page-title { font-size: 1.6rem; font-weight: 700; color: #a29bfe; margin-bottom: 24px; }
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000; padding: 0 5px; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #888; font-size: 0.7rem; width: 20%;
            transition: all 0.2s ease; padding: 8px 0;
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item.active { color: #48dbfb; }
        .nav-item:hover { color: #feca57; }
        .nav-item span { font-weight: 500; }
        .user-stats {
            margin-top: 24px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(255,255,255,0.06); border-radius: 14px; padding: 16px 20px;
            min-width: 100px; border: 1px solid rgba(255,255,255,0.08);
        }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: #48dbfb; }
        .stat-label { font-size: 0.75rem; color: #888; margin-top: 4px; }
        .user-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div id="auth-status" class="auth-status-bar"><i class="fas fa-user"></i> Gość</div>

    <div class="content">
        <h1 class="page-title">Twoje konto</h1>

        <div class="auth-container">
            <div id="firebase-warning" class="firebase-warning">
                <strong>⚠️ Firebase nie jest skonfigurowany</strong><br>
                Otwórz plik <code>js/firebase-config.js</code> i wstaw dane ze swojego projektu Firebase.
            </div>

            <!-- Zakładki -->
            <div id="auth-tabs" class="auth-tabs">
                <button type="button" id="tab-login" class="auth-tab active" onclick="showLoginForm()">Logowanie</button>
                <button type="button" id="tab-register" class="auth-tab" onclick="showRegisterForm()">Rejestracja</button>
            </div>

            <!-- Formularz logowania -->
            <form id="form-login" class="auth-form" style="display: block;">
                <input type="email" id="login-email" placeholder="Adres e-mail" required autocomplete="email">
                <input type="password" id="login-password" placeholder="Hasło" required autocomplete="current-password">
                <button type="submit">Zaloguj się</button>
            </form>

            <!-- Formularz rejestracji -->
            <form id="form-register" class="auth-form" style="display: none;">
                <input type="text" id="register-name" placeholder="Imię" required autocomplete="given-name" minlength="2">
                <input type="email" id="register-email" placeholder="Adres e-mail" required autocomplete="email">
                <input type="password" id="register-password" placeholder="Hasło (min. 6 znaków)" required autocomplete="new-password">
                <input type="password" id="register-password2" placeholder="Powtórz hasło" required autocomplete="new-password">
                <button type="submit">Utwórz konto</button>
            </form>

            <!-- Panel zalogowanego użytkownika -->
            <div id="user-panel" class="user-panel">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-name" id="user-name">—</div>
                <div class="user-email" id="user-email">—</div>
                <div class="user-label">Zalogowany</div>

                <div class="user-stats" id="user-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-workouts">0</div>
                        <div class="stat-label">Treningi</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-favorites">0</div>
                        <div class="stat-label">Ulubione</div>
                    </div>
                </div>

                <button type="button" id="btn-logout" class="btn-logout" style="margin-top:28px">
                    <i class="fas fa-sign-out-alt"></i> Wyloguj się
                </button>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Główna</span></a>
        <a href="eksploruj.html" class="nav-item"><i class="fas fa-search"></i><span>Eksploruj</span></a>
        <a href="trening.html" class="nav-item"><i class="fas fa-dumbbell"></i><span>Trening</span></a>
        <a href="biblioteka.html" class="nav-item"><i class="fas fa-book"></i><span>Biblioteka</span></a>
        <a href="ty.html" class="nav-item active"><i class="fas fa-user"></i><span>Ty</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function onAuthStateChanged(user) {
            if (user) {
                const data = await getUserData();
                if (data) {
                    const nameEl = document.getElementById('user-name');
                    if (nameEl) nameEl.textContent = data.displayName || data.name || 'Użytkownik';
                    document.getElementById('stat-workouts').textContent = (data.workouts || []).length;
                    document.getElementById('stat-favorites').textContent = (data.favorites || []).length;
                }
            }
        }
    </script>
</body>
</html>
