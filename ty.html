<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuźnia Ciała - Ty</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .wrap {
      max-width: 400px;
      margin: 0 auto;
      padding: 40px 20px 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: #a29bfe;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 4px;
    }
    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #888;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs button.on {
      background: rgba(72, 219, 251, 0.25);
      color: #48dbfb;
    }
    .box { display: none; }
    .box.show { display: block; }
    label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      margin-left: 4px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #48dbfb; }
    input::placeholder { color: #666; }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #48dbfb, #0abde3);
      color: #0f0f0f;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .msg {
      text-align: center;
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 24px;
    }
    .msg.ok { color: #00b894; }
    .msg.err { color: #e17055; }
    .msg.info { color: #48dbfb; }
    .profile { display: none; text-align: center; }
    .profile.show { display: block; }
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #48dbfb, #a29bfe);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 2rem; color: #0f0f0f;
    }
    .pname { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .pemail { color: #48dbfb; margin-bottom: 24px; word-break: break-all; }
    .btn-out {
      padding: 12px 28px;
      border: 1px solid rgba(255,107,107,0.5);
      border-radius: 12px;
      background: transparent;
      color: #ff6b6b;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      position: fixed; top: 12px; right: 12px;
      background: rgba(15,15,15,0.9);
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.75rem; color: #888;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
    }
    .status.on { color: #48dbfb; border-color: rgba(72,219,251,0.3); }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: rgba(15,15,15,0.95);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 10;
    }
    .nav a {
      display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: #888; font-size: 0.7rem; width: 20%;
    }
    .nav a i { font-size: 1.4rem; margin-bottom: 4px; }
    .nav a.active { color: #48dbfb; }
  </style>
</head>
<body>
  <div class="status" id="status"><i class="fas fa-user"></i> Gość</div>

  <div class="wrap">
    <h1>Twoje konto</h1>
    <p class="subtitle" id="subtitle">Utwórz nowe konto</p>

    <div class="tabs" id="tabs">
      <button type="button" id="btnTabReg" class="on" onclick="goRegister()">Rejestracja</button>
      <button type="button" id="btnTabLog" onclick="goLogin()">Logowanie</button>
    </div>

    <!-- REJESTRACJA: imię + e-mail + hasło + powtórz hasło -->
    <div class="box show" id="boxRegister">
      <label for="regName">Imię</label>
      <input type="text" id="regName" placeholder="Np. Jan" autocomplete="given-name">

      <label for="regEmail">E-mail</label>
      <input type="email" id="regEmail" placeholder="jan@email.com" autocomplete="email">

      <label for="regPass">Hasło</label>
      <input type="password" id="regPass" placeholder="Min. 6 znaków" autocomplete="new-password">

      <label for="regPass2">Powtórz hasło</label>
      <input type="password" id="regPass2" placeholder="Wpisz hasło ponownie" autocomplete="new-password">

      <button type="button" class="btn" onclick="doRegister()">Utwórz konto</button>
      <div class="msg" id="regMsg"></div>
    </div>

    <!-- LOGOWANIE: tylko e-mail + hasło -->
    <div class="box" id="boxLogin">
      <label for="logEmail">E-mail</label>
      <input type="email" id="logEmail" placeholder="jan@email.com" autocomplete="email">

      <label for="logPass">Hasło</label>
      <input type="password" id="logPass" placeholder="Twoje hasło" autocomplete="current-password">

      <button type="button" class="btn" onclick="doLogin()">Zaloguj się</button>
      <div class="msg" id="logMsg"></div>
    </div>

    <!-- PROFIL po zalogowaniu -->
    <div class="profile" id="boxProfile">
      <div class="avatar"><i class="fas fa-user"></i></div>
      <div class="pname" id="pName">—</div>
      <div class="pemail" id="pEmail">—</div>
      <button type="button" class="btn-out" onclick="doLogout()">Wyloguj się</button>
    </div>
  </div>

  <nav class="nav">
    <a href="index.html"><i class="fas fa-home"></i><span>Główna</span></a>
    <a href="eksploruj.html"><i class="fas fa-search"></i><span>Eksploruj</span></a>
    <a href="trening.html"><i class="fas fa-dumbbell"></i><span>Trening</span></a>
    <a href="biblioteka.html"><i class="fas fa-book"></i><span>Biblioteka</span></a>
    <a href="ty.html" class="active"><i class="fas fa-user"></i><span>Ty</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    function goRegister() {
      document.getElementById('boxRegister').classList.add('show');
      document.getElementById('boxLogin').classList.remove('show');
      document.getElementById('btnTabReg').classList.add('on');
      document.getElementById('btnTabLog').classList.remove('on');
      document.getElementById('subtitle').textContent = 'Utwórz nowe konto';
    }

    function goLogin() {
      document.getElementById('boxLogin').classList.add('show');
      document.getElementById('boxRegister').classList.remove('show');
      document.getElementById('btnTabLog').classList.add('on');
      document.getElementById('btnTabReg').classList.remove('on');
      document.getElementById('subtitle').textContent = 'Zaloguj się na swoje konto';
    }

    function setMsg(id, text, type) {
      var el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + (type || '');
    }

    var auth = null;
    var db = null;
    try {
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.error('Firebase:', e);
    }

    if (auth) {
      auth.onAuthStateChanged(function(user) {
        var tabs = document.getElementById('tabs');
        var boxReg = document.getElementById('boxRegister');
        var boxLog = document.getElementById('boxLogin');
        var boxProf = document.getElementById('boxProfile');
        var status = document.getElementById('status');
        var subtitle = document.getElementById('subtitle');

        if (user) {
          tabs.style.display = 'none';
          boxReg.classList.remove('show');
          boxLog.classList.remove('show');
          boxProf.classList.add('show');
          subtitle.textContent = 'Jesteś zalogowany';
          document.getElementById('pName').textContent = user.displayName || 'Użytkownik';
          document.getElementById('pEmail').textContent = user.email || '';
          status.innerHTML = '<i class="fas fa-user-check"></i> ' + (user.displayName || user.email);
          status.classList.add('on');
        } else {
          tabs.style.display = 'flex';
          boxProf.classList.remove('show');
          goRegister();
          status.innerHTML = '<i class="fas fa-user"></i> Gość';
          status.classList.remove('on');
        }
      });
    }

    function doRegister() {
      var name = document.getElementById('regName').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var pass = document.getElementById('regPass').value;
      var pass2 = document.getElementById('regPass2').value;

      if (name.length < 2) { setMsg('regMsg', 'Podaj imię (min. 2 znaki)', 'err'); return; }
      if (!email) { setMsg('regMsg', 'Podaj e-mail', 'err'); return; }
      if (pass.length < 6) { setMsg('regMsg', 'Hasło musi mieć min. 6 znaków', 'err'); return; }
      if (pass !== pass2) { setMsg('regMsg', 'Hasła nie są takie same', 'err'); return; }
      if (!auth) { setMsg('regMsg', 'Błąd połączenia z Firebase', 'err'); return; }

      setMsg('regMsg', 'Tworzenie konta...', 'info');

      auth.createUserWithEmailAndPassword(email, pass)
        .then(function(cred) {
          return cred.user.updateProfile({ displayName: name }).then(function() {
            return db.collection('users').doc(cred.user.uid).set({
              name: name,
              displayName: name,
              email: email,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              workouts: [],
              favorites: [],
              progress: {}
            });
          });
        })
        .then(function() {
          setMsg('regMsg', 'Konto utworzone! Witaj, ' + name + '!', 'ok');
        })
        .catch(function(err) {
          var m = {
            'auth/email-already-in-use': 'Ten e-mail jest już zajęty',
            'auth/invalid-email': 'Nieprawidłowy e-mail',
            'auth/weak-password': 'Hasło za słabe',
            'auth/operation-not-allowed': 'Włącz Email/Password w Firebase Console',
            'auth/network-request-failed': 'Brak internetu'
          };
          setMsg('regMsg', m[err.code] || err.message || 'Błąd rejestracji', 'err');
        });
    }

    function doLogin() {
      var email = document.getElementById('logEmail').value.trim();
      var pass = document.getElementById('logPass').value;

      if (!email) { setMsg('logMsg', 'Podaj e-mail', 'err'); return; }
      if (!pass) { setMsg('logMsg', 'Podaj hasło', 'err'); return; }
      if (!auth) { setMsg('logMsg', 'Błąd połączenia z Firebase', 'err'); return; }

      setMsg('logMsg', 'Logowanie...', 'info');

      auth.signInWithEmailAndPassword(email, pass)
        .then(function() {
          setMsg('logMsg', 'Zalogowano!', 'ok');
        })
        .catch(function(err) {
          var m = {
            'auth/user-not-found': 'Nie ma takiego konta',
            'auth/wrong-password': 'Błędne hasło',
            'auth/invalid-credential': 'Błędny e-mail lub hasło',
            'auth/invalid-email': 'Nieprawidłowy e-mail',
            'auth/too-many-requests': 'Zbyt wiele prób – spróbuj później'
          };
          setMsg('logMsg', m[err.code] || err.message || 'Błąd logowania', 'err');
        });
    }

    function doLogout() {
      if (auth) auth.signOut();
    }
  </script>
</body>
</html>
