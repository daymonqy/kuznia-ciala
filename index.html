<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuźnia Ciała — Dziennik Treningowy</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="loading-screen" class="screen active">
      <div class="loader">
        <div class="loader-ring"></div>
        <h1>Kuźnia Ciała</h1>
        <p>Ładowanie...</p>
      </div>
    </div>

    <div id="onboarding-screen" class="screen">
      <div class="onboarding-container">
        <div class="onboarding-progress">
          <div class="progress-bar" id="onb-progress"></div>
        </div>
        <div id="onboarding-steps"></div>
      </div>
    </div>

    <div id="main-app" class="screen">
      <header class="app-header">
        <div class="header-left">
          <button class="icon-btn" id="btn-menu" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <h1 class="app-logo">Kuźnia Ciała</h1>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="btn-search" aria-label="Szukaj">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="avatar-btn" id="btn-profile">
            <span id="header-avatar">U</span>
          </button>
        </div>
      </header>

      <main id="content" class="content-area"></main>

      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-view="dashboard">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Start</span>
        </button>
        <button class="nav-item" data-view="workout">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5h11v11h-11z"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          <span>Trening</span>
        </button>
        <button class="nav-item nav-primary" data-view="live" id="nav-start-workout">
          <div class="primary-btn-inner">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span>Start</span>
        </button>
        <button class="nav-item" data-view="exercises">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Ćwiczenia</span>
        </button>
        <button class="nav-item" data-view="progress">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Postęp</span>
        </button>
      </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay">
      <div id="modal-content" class="modal-content"></div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="data/exercises.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modules/profile.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/exercises.js"></script>
  <script src="js/modules/plans.js"></script>
  <script src="js/modules/workout.js"></script>
  <script src="js/modules/history.js"></script>
  <script src="js/modules/recovery.js"></script>
  <script src="js/modules/calculator.js"></script>
  <script src="js/modules/progress.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
