<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Kuźnia Ciała — Dziennik Treningowy</title>
  <link rel="stylesheet" href="css/styles.css?v=pro-20260923b">
  <link rel="stylesheet" href="css/refine.css?v=fix3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    #auth-screen { overflow-y: auto; background: var(--bg); }
    .auth-wrap { max-width: 420px; margin: 0 auto; padding: 40px 20px 48px; width: 100%; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); }
    .auth-logo p { color: var(--text-secondary); margin-top: 8px; font-size: 13.5px; }
    .auth-tabs {
      display: flex; gap: 4px; background: var(--bg-card); padding: 3px;
      border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border);
    }
    .auth-tabs .tab {
      flex: 1; padding: 12px; text-align: center; border-radius: 6px;
      font-size: 13.5px; font-weight: 600; background: transparent; border: none;
      color: var(--text-muted); cursor: pointer;
    }
    .auth-tabs .tab.active { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); }
    .auth-message {
      display: none; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px;
      font-size: 13.5px; font-weight: 500;
    }
    .auth-message.error { display: block; background: rgba(224,84,84,0.1); color: #e05454; border: 1px solid rgba(224,84,84,0.25); }
    .auth-message.success { display: block; background: rgba(61,154,106,0.1); color: #3d9a6a; border: 1px solid rgba(61,154,106,0.25); }
    .auth-message.info { display: block; background: var(--primary-dim); color: var(--primary); border: 1px solid rgba(201,162,39,0.25); }
    .auth-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading-screen" class="screen active">
      <div class="loader">
        <div class="loader-ring"></div>
        <h1>Kuźnia Ciała</h1>
        <p>Ładowanie...</p>
      </div>
    </div>

    <div id="auth-screen" class="screen">
      <div class="auth-wrap">
        <div class="auth-logo">
          <h1>Kuźnia Ciała</h1>
          <p>Zaloguj się, aby zapisywać treningi na koncie</p>
        </div>
        <div class="auth-tabs" id="auth-tabs">
          <button type="button" class="tab active" id="tab-login">Logowanie</button>
          <button type="button" class="tab" id="tab-register">Rejestracja</button>
        </div>
        <div id="auth-message" class="auth-message"></div>
        <div class="auth-card">
          <div id="form-login">
            <div class="form-group">
              <label>E-mail</label>
              <input class="form-input" type="email" id="login-email" autocomplete="email" placeholder="ty@email.com">
            </div>
            <div class="form-group">
              <label>Hasło</label>
              <input class="form-input" type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="button" class="btn btn-primary btn-block btn-lg" id="btn-do-login">Zaloguj się</button>
          </div>
          <div id="form-register" class="hidden">
            <div class="form-group">
              <label>Imię / pseudonim</label>
              <input class="form-input" type="text" id="reg-name" autocomplete="name" placeholder="Jan">
            </div>
            <div class="form-group">
              <label>E-mail</label>
              <input class="form-input" type="email" id="reg-email" autocomplete="email" placeholder="ty@email.com">
            </div>
            <div class="form-group">
              <label>Hasło</label>
              <input class="form-input" type="password" id="reg-password" autocomplete="new-password" placeholder="min. 6 znaków">
            </div>
            <div class="form-group">
              <label>Powtórz hasło</label>
              <input class="form-input" type="password" id="reg-password2" autocomplete="new-password" placeholder="••••••••">
            </div>
            <button type="button" class="btn btn-primary btn-block btn-lg" id="btn-do-register">Utwórz konto</button>
          </div>
        </div>
      </div>
    </div>

    <div id="main-app" class="screen">
      <header class="app-header">
        <div class="header-left">
          <button class="icon-btn" id="btn-menu" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <h1 class="app-logo">Kuźnia Ciała</h1>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="btn-search" aria-label="Szukaj">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="avatar-btn" id="btn-profile">
            <span id="header-avatar">U</span>
          </button>
        </div>
      </header>
      <main id="content" class="content-area"></main>
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-view="dashboard">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Start</span>
        </button>
        <button class="nav-item" data-view="workout">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5h11v11h-11z"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          <span>Trening</span>
        </button>
        <button class="nav-item nav-primary" data-view="live" id="nav-start-workout">
          <div class="primary-btn-inner">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span>Start</span>
        </button>
        <button class="nav-item" data-view="exercises">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Ćwiczenia</span>
        </button>
        <button class="nav-item" data-view="progress">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Postęp</span>
        </button>
      </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay">
      <div id="modal-content" class="modal-content"></div>
    </div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="data/muscle-tree.js?v=2"></script>
  <script src="data/exercises.js?v=tree2"></script>
  <script src="js/storage.js?v=fix4"></script>
  <script src="js/utils.js?v=fix4"></script>
  <script src="js/auth-app.js?v=3"></script>
  <script src="js/modules/profile.js?v=3"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/exercises.js?v=tree2"></script>
  <script src="js/modules/plans.js?v=fix5"></script>
  <script src="js/modules/workout.js"></script>
  <script src="js/modules/history.js"></script>
  <script src="js/modules/recovery.js?v=tree2"></script>
  <script src="js/modules/calculator.js"></script>
  <script src="js/modules/progress.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
